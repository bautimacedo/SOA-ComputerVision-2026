server {
    listen 80;
    server_name soagmr.mooo.com auth.soagmr.mooo.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name auth.soagmr.mooo.com;

    ssl_certificate     /etc/letsencrypt/live/soagmr.mooo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/soagmr.mooo.com/privkey.pem;

    location / {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }
}

server {
    listen 443 ssl;
    server_name soagmr.mooo.com;

    ssl_certificate     /etc/letsencrypt/live/soagmr.mooo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/soagmr.mooo.com/privkey.pem;

    client_max_body_size 50M;

    location /adminer/ {
        proxy_pass http://adminer:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /grafana/ {
        proxy_pass http://grafana:3000/grafana/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}

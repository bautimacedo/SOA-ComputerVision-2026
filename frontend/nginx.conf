server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # vue-router usa history mode (URLs sin #) — cualquier ruta que no sea
    # un archivo real (JS/CSS/imagen) tiene que devolver index.html para que
    # el router de Vue la resuelva en el navegador, no nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

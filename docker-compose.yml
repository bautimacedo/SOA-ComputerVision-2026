services:
  app:
    build: .
    container_name: soa_app
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"  # solo para pruebas locales sin nginx (Postman directo). En la VPS no hace falta, nginx hace proxy interno.
    volumes:
      - ./models:/app/models
      - insightface_cache:/root/.insightface  # evita re-descargar el modelo buffalo_l en cada rebuild/recreate
    extra_hosts:
      - "host.docker.internal:host-gateway"  # permite llegar al inference_service que corre en el host (fuera de Docker), simulando la PC local vía Tailscale
    depends_on:
      db:
        condition: service_healthy
    networks:
      - soa_net

  db:
    image: pgvector/pgvector:pg16
    container_name: soa_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: soa
      POSTGRES_PASSWORD: soa
      POSTGRES_DB: soatp
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soa -d soatp"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - soa_net

  nginx:
    image: nginx:alpine
    container_name: soa_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - soa_net

  adminer:
    image: adminer
    container_name: soa_adminer
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - soa_net

  keycloak_db:
    image: postgres:16-alpine
    container_name: soa_keycloak_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
    volumes:
      - keycloak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d ${KEYCLOAK_DB_NAME:-keycloak}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - soa_net

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: soa_keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      keycloak_db:
        condition: service_healthy
    networks:
      - soa_net

  influxdb:
    image: influxdb:2.7
    container_name: soa_influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: soa2026admin
      DOCKER_INFLUXDB_INIT_ORG: soa
      DOCKER_INFLUXDB_INIT_BUCKET: metrics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: soa-token-2026
    volumes:
      - influxdata:/var/lib/influxdb2
    networks:
      - soa_net

  telegraf:
    image: telegraf:1.32
    container_name: soa_telegraf
    restart: unless-stopped
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - influxdb
    networks:
      - soa_net

  grafana:
    image: grafana/grafana:11.0.0
    container_name: soa_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"  # solo para pruebas locales sin nginx. En la VPS no hace falta, nginx hace proxy en /grafana/.
    environment:
      GF_SECURITY_ADMIN_PASSWORD: soa2026
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://soagmr.mooo.com/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GRAFANA_SERVE_FROM_SUB_PATH:-true}
      # Login vía Keycloak (Authorization Code Flow) — client "grafana-client"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana-client
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_KEYCLOAK_CLIENT_SECRET}
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid email profile"
      # auth_url lo pega el NAVEGADOR → URL pública de Keycloak
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/realms/${KEYCLOAK_REALM:-soa-realm}/protocol/openid-connect/auth
      # token_url y api_url los pega Grafana server-side → red interna de Docker
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM:-soa-realm}/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM:-soa-realm}/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      # Solo ADMIN puede entrar a Grafana — si el claim realm_access.roles no contiene
      # ADMIN, la expresión da '' (rol inválido) y, con STRICT=true, Grafana rechaza el login.
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(realm_access.roles, 'ADMIN') && 'Admin' || ''"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - keycloak
    networks:
      - soa_net

volumes:
  pgdata:
  keycloak_pgdata:
  influxdata:
  grafanadata:
  insightface_cache:

networks:
  soa_net:
    driver: bridge
